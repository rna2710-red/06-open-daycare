schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
context: |
  Open Daycare es una app web multi-tenant de gestión de guarderías (Next.js + Supabase).
  Objetivo: conectar al staff de la guardería con las familias — el staff administra
  niños, salones y publica un feed de novedades del día; los padres se vinculan por
  invitación para seguir el resumen del día de sus hijos.
  Escribe todos los artefactos en español.

